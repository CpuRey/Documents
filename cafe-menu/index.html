<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>GUARDIANS CAFE</h1>
        <p class="established">Est. 2020</p>
        <hr>
        <section>
          <h2>Coffee</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>
          <article class="item">
            <p class="flavor">Espresso</p><p class="price">$5.90</p>
          </article>
          <article class="item">
            <p class="flavor">Macchiato</p><p class="price">$5.95</p>
          </article>
          <article class="item">
            <p class="flavor">Coffee With Cream</p><p class="price">$5.95</p>
          </article>
          <article class="item">
            <p class="flavor">Chocolate Coffee</p><p class="price">$4.25</p>
          </article>
          <article class="item">
            <p class="flavor">House Blend</p><p class="price">$3.99</p>
          </article>
        </section>
        <section>
          <h2>Desserts</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>
          <article class="item">
            <p class="dessert">Chocolate Donut</p><p class="price">$4.50</p>
          </article>
          <article class="item">
            <p class="dessert">Brownies</p><p class="price">$2.75</p>
          </article>
          <article class="item">
            <p class="dessert">Muffins</p><p class="price">$3.70</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p><p class="price">$2.50</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Visit our website</a>
          </p>
          <p class="address">123 Saint Marry Ave</p>
        </address>
      </footer>
    </div>
  </body>
</html>
